<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages has no server-side rewrite for a client-side router, so a
      // direct load or refresh of a deep link (e.g. /projects/comet) 404s.
      // This re-encodes the path into a query string and redirects to
      // index.html, which decodes it back before React Router ever mounts.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // matches the /<repo-name>/ base path GitHub Pages serves from
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
